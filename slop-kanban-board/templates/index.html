<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>
    <div class="container">
        <header>
            <h1><i class="fas fa-chess"></i> Kanban Board</h1>
            <p>Organize your workflow efficiently</p>
        </header>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search tasks..." oninput="searchTasks()">
            <button onclick="toggleModal()" class="btn-primary"><i class="fas fa-plus"></i> New Task</button>
        </div>

        <div class="board">
            <div class="column" id="blocked">
                <div class="column-header">
                    <h2>Blocked</h2>
                    <span class="count" id="count-blocked">0</span>
                </div>
                <div class="task-list" id="blocked-tasks"></div>
            </div>
            <div class="column" id="todo">
                <div class="column-header">
                    <h2>To Do</h2>
                    <span class="count" id="count-todo">0</span>
                </div>
                <div class="task-list" id="todo-tasks"></div>
            </div>
            <div class="column" id="in-progress">
                <div class="column-header">
                    <h2>In Progress</h2>
                    <span class="count" id="count-in-progress">0</span>
                </div>
                <div class="task-list" id="in-progress-tasks"></div>
            </div>
            <div class="column" id="done">
                <div class="column-header">
                    <h2>Done</h2>
                    <span class="count" id="count-done">0</span>
                </div>
                <div class="task-list" id="done-tasks"></div>
            </div>
        </div>

        <!-- Modal for Adding New Tasks -->
        <div id="add-task-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
            <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; width: 100%;">
                <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                    <h3><i class="fas fa-plus"></i> New Item</h3>
                    <button onclick="toggleModal()" style="border: none; background: transparent; font-size: 1.5rem; cursor: pointer;">&times;</button>
                </header>
                <div style="margin-top: 20px;">
                    <div class="form-group" style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="task-title" placeholder="Task Title" required style="flex: 1; padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px;">
                        <select id="task-priority" style="padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px;">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                        <input type="number" id="task-blocker-id" placeholder="Blocker ID (Optional)" style="width: 80px; padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px;">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="date" id="task-due-date" style="width: 100%; padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px;">
                    </div>
                    <textarea id="task-desc" placeholder="Task Description..." rows="3" style="width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px; resize: vertical;"></textarea>
                    <textarea id="task-dod" placeholder="Definition of Done..." rows="2" style="width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px; resize: vertical;"></textarea>
                </div>
                <footer style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button onclick="toggleModal()" class="btn-secondary">Cancel</button>
                    <button onclick="addTask()" class="btn-primary">Add to Board</button>
                </footer>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
