<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>

    <div class="container">
        <header>
            <h1><i class="fas fa-chess"></i> Kanban Board</h1>
            <p>Organize your workflow efficiently</p>
        </header>
  
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search tasks..." oninput="searchTasks()">
            <button onclick="clearSearch()" class="btn-secondary">Clear</button>
        </div>
  
        <div class="board">
            <div class="column" id="blocked">
                <div class="column-header">
                    <h2>Blocked</h2>
                    <span class="count" id="count-blocked">0</span>
                </div>
                <div class="task-list" id="blocked-tasks"></div>
            </div>
            <div class="column" id="todo">
                <div class="column-header">
                    <h2>To Do</h2>
                    <span class="count" id="count-todo">0</span>
                </div>
                <div class="task-list" id="todo-tasks"></div>
            </div>
            <div class="column" id="in-progress">
                <div class="column-header">
                    <h2>In Progress</h2>
                    <span class="count" id="count-in-progress">0</span>
                </div>
                <div class="task-list" id="in-progress-tasks"></div>
            </div>
            <div class="column" id="done">
                <div class="column-header">
                    <h2>Done</h2>
                    <span class="count" id="count-done">0</span>
                </div>
                <div class="task-list" id="done-tasks"></div>
            </div>
        </div>
  
        <div class="add-task-container">
            <div class="add-task-card">
                <h3><i class="fas fa-plus"></i> Create New Task</h3>
                <div class="form-group">
                    <input type="text" id="task-title" placeholder="Task Title" required>
                     <select id="task-priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                    <input type="number" id="task-blocker-id" placeholder="Blocker ID (Optional)" style="width: 80px;">
                </div>

                <div class="form-group">
                    <input type="date" id="task-due-date" style="width: 100%;">
                </div>
                <textarea id="task-desc" placeholder="Task Description..." rows="3"></textarea>
                <textarea id="task-dod" placeholder="Definition of Done..." rows="2"></textarea>
                <button onclick="addTask()" class="btn-primary">Add to Board</button>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
