<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Project Kanban Board</h1>
        <button id="addTaskBtn">+ Add New Task</button>
    </header>

    <main class="board">
        <div class="column" id="to_do">
            <h2 class="column-header">To Do</h2>
            <input type="text" class="search-input" placeholder="Search tasks...">
            <div class="task-list" id="list-to_do"></div>
        </div>
        <div class="column" id="in_progress">
            <h2 class="column-header">In Progress</h2>
            <input type="text" class="search-input" placeholder="Search tasks...">
            <div class="task-list" id="list-in_progress"></div>
        </div>
        <div class="column" id="done">
            <h2 class="column-header">Done</h2>
            <input type="text" class="search-input" placeholder="Search tasks...">
            <div class="task-list" id="list-done"></div>
        </div>
    </main>

    <!-- Add Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>Create New Task</h3>
            <form id="taskForm">
                <input type="hidden" id="task_id">
                <input type="hidden" id="task_status">
                <label>Title</label>

                <input type="text" id="title" placeholder="What needs to be done?" required>
                
                <label>Description</label>
                <textarea id="description" placeholder="Add details..." rows="5"></textarea>
                
                <label>Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
                
                <button type="submit" class="submit-btn" id="submitBtn">Add Task</button>
            </form>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
