apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanbanflow-data
  labels:
    app: kanbanflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanbanflow
  labels:
    app: kanbanflow
spec:
  replicas: 1
  # Recreate ensures the single ReadWriteOnce SQLite PVC detaches cleanly before the new pod mounts it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kanbanflow
  template:
    metadata:
      labels:
        app: kanbanflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: kanbanflow
          image: kanbanflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KANBAN_DB_PATH
              value: /data/kanban.db
            - name: OTEL_SERVICE_NAME
              value: kanbanflow
            - name: DEPLOYMENT_ENV
              value: production
            # Uncomment to export OTLP/HTTP traces, metrics, and logs to your cluster collector:
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability.svc.cluster.local:4318
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kanbanflow-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kanbanflow
  labels:
    app: kanbanflow
spec:
  type: ClusterIP
  selector:
    app: kanbanflow
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
